[package]
name = "pasteclean"
version = "0.1.0"
description = "PasteClean removes tracking parameters from shared links."
authors = ["PasteClean"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pasteclean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
